[project]
name = "jobflow"
version = "0.1.0"
description = "Real-time job pipeline: Django + Channels + Celery + Redis + PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "channels>=4.2",
    "channels-redis>=4.2",
    "djangorestframework>=3.15",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "psycopg[binary,pool]>=3.2",
    "uvicorn[standard]>=0.32",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "daphne>=4.1",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
